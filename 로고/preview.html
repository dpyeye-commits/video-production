<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>중부대 자연치유계열 학술지 로고</title>
<style>
  body{margin:0;font-family:'Noto Serif KR',serif;background:#F7F4EC;color:#16241F}
  .wrap{max-width:980px;margin:0 auto;padding:48px 24px}
  h1{font-size:20px;font-weight:600;color:#1F5D4C;border-bottom:1px solid #C2A14D;padding-bottom:10px}
  .card{background:#fff;border:1px solid #e5e0d2;border-radius:14px;padding:40px;margin:22px 0;
        box-shadow:0 6px 24px rgba(31,93,76,.06);text-align:center}
  .green{background:linear-gradient(135deg,#1F5D4C,#173E33)}
  .lbl{font-size:12px;letter-spacing:3px;color:#7B8A82;text-transform:uppercase;margin-bottom:18px}
  .row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center}
  img{display:block}
</style></head>
<body><div class="wrap">
  <h1>중부대학교 자연치유계열 학술지 — 로고 시안 (영상사령관)</h1>

  <div class="card">
    <div class="lbl">Primary Lockup</div>
    <img src="lockup.svg" width="660" alt="lockup">
  </div>

  <div class="card">
    <div class="lbl">Emblem</div>
    <img src="emblem.svg" width="240" alt="emblem">
  </div>

  <div class="card green">
    <div class="lbl" style="color:#C2A14D">Emblem on brand green</div>
    <img src="emblem.svg" width="220" alt="emblem on green" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))">
  </div>

  <div class="card">
    <div class="lbl">Scalability (favicon 48 · 32 · 24px)</div>
    <div class="row">
      <img src="emblem.svg" width="48"><img src="emblem.svg" width="32"><img src="emblem.svg" width="24">
    </div>
  </div>

  <p style="text-align:center;color:#7B8A82;font-size:13px">
    컨셉: 학술 인장(seal) + 잎사귀 · 잎맥을 맥박(pulse)으로 표현해 <b>자연(생명)</b>과 <b>치유</b>를 한 기호에 결합.<br>
    팔레트: 상록 그린 #1F5D4C · 세이지 #8FB9A8 · 학술 골드 #C2A14D · 잉크 #16241F
  </p>
</div></body></html>
